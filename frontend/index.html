<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TaskFlow Pro</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
  };
</script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
</style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-200">

<div class="max-w-3xl mx-auto p-4 sm:p-6">

  <header class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-semibold">TaskFlow Pro</h1>
    <button id="themeToggleBtn" class="rounded-xl px-3 py-2 bg-white/70 dark:bg-gray-800/70 backdrop-blur shadow-lg hover:shadow-xl transition">
      <span id="themeToggleIcon">🌙</span>
    </button>
  </header>

  <section class="rounded-xl bg-white/70 dark:bg-gray-800/70 backdrop-blur shadow-lg p-4 sm:p-6 mb-6">
    <h2 class="text-lg font-medium mb-3">새 작업 추가</h2>
    <form id="taskForm" class="flex flex-col gap-3">
      <input id="titleInput" type="text" placeholder="제목" required
        class="rounded-xl px-3 py-2 bg-white dark:bg-gray-700 shadow-sm border border-gray-200 dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-400" />
      <div class="flex flex-col sm:flex-row gap-3">
        <input id="dueAtInput" type="datetime-local"
          class="flex-1 rounded-xl px-3 py-2 bg-white dark:bg-gray-700 shadow-sm border border-gray-200 dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-400" />
        <select id="statusInput"
          class="rounded-xl px-3 py-2 bg-white dark:bg-gray-700 shadow-sm border border-gray-200 dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-400">
          <option value="todo">todo</option>
          <option value="in_progress">in_progress</option>
          <option value="done">done</option>
        </select>
      </div>
      <button type="submit"
        class="rounded-xl px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white shadow-lg transition self-start">
        추가
      </button>
    </form>
  </section>

  <section>
    <h2 class="text-lg font-medium mb-3">작업 목록</h2>
    <div id="taskList" class="flex flex-col gap-3"></div>
  </section>

</div>

<div id="taskModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
  <div class="rounded-xl bg-white/90 dark:bg-gray-800/90 backdrop-blur shadow-lg w-full max-w-md p-6">
    <h2 class="text-lg font-medium mb-4">작업 수정</h2>
    <form id="editForm" class="flex flex-col gap-3">
      <input id="editTitleInput" type="text" required
        class="rounded-xl px-3 py-2 bg-white dark:bg-gray-700 shadow-sm border border-gray-200 dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-400" />
      <textarea id="editDescriptionInput" placeholder="설명" rows="3"
        class="rounded-xl px-3 py-2 bg-white dark:bg-gray-700 shadow-sm border border-gray-200 dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-400"></textarea>
      <input id="editDueAtInput" type="datetime-local"
        class="rounded-xl px-3 py-2 bg-white dark:bg-gray-700 shadow-sm border border-gray-200 dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-400" />
      <select id="editStatusInput"
        class="rounded-xl px-3 py-2 bg-white dark:bg-gray-700 shadow-sm border border-gray-200 dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-400">
        <option value="todo">todo</option>
        <option value="in_progress">in_progress</option>
        <option value="done">done</option>
      </select>
      <div class="flex justify-end gap-2 mt-2">
        <button type="button" id="cancelEditBtn"
          class="rounded-xl px-4 py-2 bg-gray-200 dark:bg-gray-600 shadow hover:shadow-md transition">취소</button>
        <button type="submit"
          class="rounded-xl px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white shadow-lg transition">저장</button>
      </div>
    </form>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
